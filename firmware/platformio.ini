[platformio]
; Point to main/ so PlatformIO's source-directory check passes.
; The actual build is driven by the root CMakeLists.txt (ESP-IDF native structure).
src_dir = main

[env:stackchan]
platform = espressif32
board = m5stack-cores3
framework = espidf

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio

; sdkconfig is generated from sdkconfig.defaults at the project root
; Upload & monitor
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; Bypass the IDF component manager (pre-fetched managed_components/ already present)
extra_scripts = pre:pio_extra_script.py
